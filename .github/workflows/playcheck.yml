name: Henry playback check

on:
  schedule:
    - cron: '25 * * * *'   # hourly; Supabase reads results.json at :50
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node playcheck.mjs
      - name: Save results
        run: |
          git config user.name "henry-playcheck"
          git config user.email "actions@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || git commit -m "Playback check results"
          git push
